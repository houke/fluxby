<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP: the dark mode FOUC script below is allowed by its SHA-256 hash.
         Update the hash when editing it (tests/web/csp-hashes.test.ts checks this). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-FzBHek/IEN/zBWizrCMKE0j0hDCl8j0njqcedW/i3KI='; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8B5CF6" />
    <title>Fluxby</title>
    <meta
      name="description"
      content="Fluxby - Personal finance management made fun and simple."
    />
    <script>
      // Prevent flash of unstyled content (FOUC) for dark mode
      (function () {
        const stored = localStorage.getItem('fluxby.landing.theme');
        if (
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
