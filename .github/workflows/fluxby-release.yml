name: 'Fluxby Release'
# Builds, tags, and publishes a new Fluxby release when a version tag (v*) is pushed.
# Do not run manually.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step 1: Initialize and generate changelog
  initialize-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      version: ${{ steps.get-version.outputs.version }}
      dry_run: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get current and target version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "Error: No version provided and not triggered by tag."
            exit 1
          fi

      - name: Update versions and metadata (Manual Trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"

          # Update package.json files
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" apps/tauri/package.json

          # Update tauri.conf.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" apps/tauri/tauri.conf.json

          echo "Updated versions to $VERSION"

      - name: Check localization and release note parsing
        run: npm run test:run -- tests/shared/localization.test.ts tests/web/release-notes-parser.test.ts

      - name: Generate bilingual changelog from translations
        id: changelog
        run: |
          npx tsx scripts/generate-release-notes.ts "$GITHUB_REF_NAME" > changelog_body.md
          {
            echo 'changelog<<EOF'
            cat changelog_body.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog_body.md
          retention-days: 1

      - name: Generate API Assets
        run: npm run generate:api

      - name: Commit, Tag and Push (Manual Trigger only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"

          git push origin main
          git push origin "v${VERSION}"
          echo "Committed, tagged and pushed version $VERSION"

  # Step 2: Create release with changelog
  create-release:
    needs: initialize-release
    if: needs.initialize-release.outputs.dry_run != 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download changelog artifact
        uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Read changelog
        id: read-changelog
        run: |
          CHANGELOG=$(cat changelog_body.md)
          echo "Changelog content:"
          cat changelog_body.md

      - name: Build release body with downloads table
        id: build-body
        run: |
          VERSION="${{ needs.initialize-release.outputs.version }}"
          cat changelog_body.md > release_body.md
          cat >> release_body.md << EOF

          ---

          ## Downloads / Downloads

          | Platform | Download / Downloaden |
          |----------|----------|
          | Windows (x64) | [Fluxby_${VERSION}_x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Fluxby_${VERSION}_x64-setup.exe) |
          | Windows (ARM64) | [Fluxby_${VERSION}_arm64-setup.exe](https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Fluxby_${VERSION}_arm64-setup.exe) |
          | macOS (Universal) | [Fluxby_${VERSION}_universal.dmg](https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Fluxby_${VERSION}_universal.dmg) |
          | Linux (AppImage) | [Fluxby_${VERSION}_amd64.AppImage](https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Fluxby_${VERSION}_amd64.AppImage) |
          | Linux (Debian) | [Fluxby_${VERSION}_amd64.deb](https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Fluxby_${VERSION}_amd64.deb) |

          > **macOS (Nederlands):** De app is niet ondertekend met een code signing-certificaat. Open de app de eerste keer via de rechtermuisknop en kies "Open"; bevestig daarna in het venster om Gatekeeper te omzeilen.
          >
          > **macOS (English):** The app is not code signed. On first launch, right-click the app and select "Open", then click "Open" in the dialog to bypass Gatekeeper.
          EOF

      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.initialize-release.outputs.version }}
          name: Fluxby v${{ needs.initialize-release.outputs.version }}
          draft: true
          prerelease: false
          make_latest: true
          body_path: release_body.md

  # Step 3: Build for all platforms
  build-tauri:
    needs: [initialize-release, create-release]
    if: needs.initialize-release.outputs.dry_run != 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            rust-targets: ''
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            rust-targets: ''
          - platform: 'windows-latest'
            args: '--target aarch64-pc-windows-msvc'
            rust-targets: 'aarch64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.initialize-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Add Rust targets
        if: matrix.rust-targets != ''
        shell: bash
        run: |
          for target in $(echo "${{ matrix.rust-targets }}" | tr ',' '\n'); do
            rustup target add $target
          done

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies
        run: |
          npm run build -w packages/shared
          npm run build -w packages/database
          npm run build -w packages/core
          npm run build -w apps/web

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: apps/tauri
          args: ${{ matrix.args }}

  # Step 4: Publish the release
  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [initialize-release, create-release, build-tauri]
    if: needs.initialize-release.outputs.dry_run != 'true'
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v${{ needs.initialize-release.outputs.version }} \
            --repo ${{ github.repository }} \
            --draft=false \
            --latest
